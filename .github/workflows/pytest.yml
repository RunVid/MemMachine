name: Run Python unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ (github.event.pull_request.head.ref || github.ref) != 'refs/heads/main' }}

jobs:
  unit-test:
    name: Fast unit tests (no API keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: uv run --frozen pytest -n auto -m "not integration"
